# KORU ONE - Local infrastructure baseline
# Run: docker compose up -d
# IMPORTANT: development defaults; never expose these services publicly.
name: koru-one

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koruone}
      POSTGRES_USER: ${POSTGRES_USER:-koruone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [app-net]

  redis-cache:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:-change-me-local-cache}
      REDIS_CACHE_MAXMEMORY: ${REDIS_CACHE_MAXMEMORY:-256mb}
    command:
      - sh
      - -ec
      - |
        exec redis-server \
          --save '' \
          --appendonly no \
          --maxmemory "$$REDIS_CACHE_MAXMEMORY" \
          --maxmemory-policy allkeys-lru \
          --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_CACHE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 4s
      retries: 10
    networks: [app-net]

  redis-streams:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_STREAMS_PASSWORD:-change-me-local-streams}
    command:
      - sh
      - -ec
      - |
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --maxmemory-policy noeviction \
          --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_STREAMS_PORT:-6380}:6379"
    volumes:
      - redis_streams_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 4s
      retries: 10
    networks: [app-net]

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  redis_streams_data:
