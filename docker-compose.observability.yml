# KORU ONE - Optional local Redis monitoring (Prometheus + Grafana)
# Run: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Prometheus config is embedded to keep this packet self-contained.

services:
  redis-cache-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis-cache:6379
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:-change-me-local-cache}
    depends_on:
      redis-cache:
        condition: service_healthy
    networks: [app-net, metrics-net]

  redis-streams-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis-streams:6379
      REDIS_PASSWORD: ${REDIS_STREAMS_PASSWORD:-change-me-local-streams}
    depends_on:
      redis-streams:
        condition: service_healthy
    networks: [app-net, metrics-net]

  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    configs:
      - source: prometheus-local-config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - redis-cache-exporter
      - redis-streams-exporter
    networks: [metrics-net]

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [metrics-net]

configs:
  prometheus-local-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ['prometheus:9090']
        - job_name: redis-cache
          static_configs:
            - targets: ['redis-cache-exporter:9121']
        - job_name: redis-streams
          static_configs:
            - targets: ['redis-streams-exporter:9121']

networks:
  metrics-net:
    driver: bridge
    internal: true

volumes:
  prometheus_data:
  grafana_data:
